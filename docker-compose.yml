services:
  commission-model:
    build: .
    ports:
      - "8501:8501"
    volumes:
      - .:/app
      - /app/.venv
    command:
      - streamlit
      - run
      - main.py
      - --server.address=0.0.0.0
      - --server.port=8501
      - --server.headless=true
      - --server.fileWatcherType=poll
    restart: unless-stopped
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8501/_stcore/health')",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
